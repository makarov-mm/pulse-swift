name: macOS build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Run model and native sampler tests
        run: swift test
      - name: Build and verify local app bundle
        run: sh scripts/build-app.sh
